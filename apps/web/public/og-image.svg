<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Stone background — matches the app's bg-stone-50 -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- Top brass accent rule -->
  <rect x="80" y="80" width="1040" height="4" fill="#92400e"/>

  <!-- ─── Left column: type ────────────────────────────────────────────── -->

  <!-- Wordmark — IBM Plex Sans Condensed Bold, ink. Sized to fit the left
       half (was 148px when the type ran the full width). -->
  <text x="80" y="180"
        font-family="'IBM Plex Sans Condensed', 'Helvetica Neue Condensed', 'Arial Narrow', sans-serif"
        font-weight="700"
        font-size="100"
        fill="#0c0a09"
        letter-spacing="4">PROOFINESS</text>

  <!-- Tagline — serif italic, secondary -->
  <text x="80" y="230"
        font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="32"
        fill="#57534e">A Quest for Truth — with Receipts!</text>

  <!-- Value-prop bullets — accent checkmark + serif prose, three items -->
  <text x="80" y="340" font-family="'IBM Plex Serif', Georgia, serif"
        font-size="26" font-weight="600" fill="#92400e">✓</text>
  <text x="115" y="340" font-family="'IBM Plex Serif', Georgia, serif"
        font-size="26" fill="#1c1917">Enter a factual claim to check</text>

  <text x="80" y="385" font-family="'IBM Plex Serif', Georgia, serif"
        font-size="26" font-weight="600" fill="#92400e">✓</text>
  <text x="115" y="385" font-family="'IBM Plex Serif', Georgia, serif"
        font-size="26" fill="#1c1917">Get back a calibrated rating and dossier</text>

  <text x="80" y="430" font-family="'IBM Plex Serif', Georgia, serif"
        font-size="26" font-weight="600" fill="#92400e">✓</text>
  <text x="115" y="430" font-family="'IBM Plex Serif', Georgia, serif"
        font-size="26" fill="#1c1917">Check the &quot;receipts&quot; for detailed analysis</text>

  <!-- ─── Right column: mascot ─────────────────────────────────────────── -->
  <!-- Native PNG is 800×624 (aspect 1.282). At 400 wide, height = 312.
       Vertically centered between the top rule (y=84) and bottom rule (y=555). -->
  <image href="proofiness-logo.png"
         x="720" y="164" width="400" height="312"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- ─── Footer ───────────────────────────────────────────────────────── -->

  <!-- Bottom rule -->
  <rect x="80" y="555" width="1040" height="1" fill="#d6d3d1"/>

  <!-- URL, mono, bottom-left -->
  <text x="80" y="588"
        font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace"
        font-size="20"
        font-weight="500"
        fill="#57534e"
        letter-spacing="1.5">PROOFINESS.ORG</text>

  <!-- Document-genre micro-label, bottom-right (mono, brass) -->
  <text x="1120" y="588"
        font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace"
        font-size="14"
        font-weight="500"
        fill="#92400e"
        letter-spacing="2"
        text-anchor="end">CIVIC FACT-VERIFICATION · OPEN SOURCE · FREE</text>
</svg>
